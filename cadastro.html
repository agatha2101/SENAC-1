<!DOCTYPE html>

<html>

<head>

    <meta charset="utf-8">

    <title>IAmigo | Cadastro </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>

</head>

<body style="background-color: #f8f9fa; justify-items: center; font-family: 'Inter', sans-serif;" class="bg-gradient-custom min-h-screen flex items-center justify-center p-4">

<div style="margin: 40px; justify-items: center;" class="flex flex-col items-center mb-10">

    <h1>Seja bem-vindo!</h1>

    <p>Realize seu cadastro para começar sua experiência com a nossa IA.</p>
</div>

<main class="container vh-100 d-flex justify-content-center align-items-center">
    <form>
    <input id="nome"
    style="width: 1200px; margin: 50px; margin-bottom: 5px;"
    required type="text"
    placeholder="Nome"
    class="form-control">

    <input id="cpf"
    style="width: 1200px; margin: 50px; margin-bottom: 5px;"
    type="number"
    placeholder="CPF"
    class="form-control mt-2">

    <input id="email"
    style="width: 1200px; margin: 50px; margin-bottom: 5px;"
    type="email"
    placeholder="E-mail"
    class="form-control mt-2">

    <input id="numero"
    style="width: 1200px; margin: 50px; margin-bottom: 5px;"
    type="number"
    placeholder="Celular"
    class="form-control mt-2">


    <button type="submit"
    style="box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    background-color:#0e365e;
    border-color:#0e365e;
    margin:50px;
    width:150px;"
    class="btn btn-primary">
        Cadastrar
    </button>

    </form>
</main>
